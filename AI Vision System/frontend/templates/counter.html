{% extends "base.html" %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    <div class="lg:col-span-3 space-y-8">
        <div
            class="glass p-8 rounded-3xl h-[600px] flex flex-col items-center justify-center relative overflow-hidden group">
            <div id="loading" class="hidden absolute inset-0 bg-slate-900/80 z-20 flex items-center justify-center">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-cyan-500"></div>
            </div>
            <img id="display-image" src="" alt=""
                class="max-h-full max-w-full rounded-2xl shadow-2xl hidden z-10 transition-transform duration-500 group-hover:scale-[1.02]">
            <div id="upload-prompt" class="text-center space-y-6">
                <div
                    class="h-24 w-24 bg-cyan-500/10 text-cyan-500 rounded-3xl flex items-center justify-center mx-auto text-4xl">
                    🔢
                </div>
                <h2 class="text-3xl font-bold">Intelligent Object Counting</h2>
                <p class="text-slate-400">Multi-class detection using YOLOv8 pretrained models.</p>
                <div class="flex gap-4 justify-center">
                    <label
                        class="btn-premium px-8 py-3 rounded-2xl cursor-pointer font-bold text-white shadow-lg flex items-center gap-2">
                        <span>Upload Media</span>
                        <input type="file" id="media-upload" class="hidden" accept="image/*,video/*">
                    </label>
                    <button id="start-webcam"
                        class="bg-slate-800 hover:bg-slate-700 px-8 py-3 rounded-2xl font-bold flex items-center gap-2 transition-colors">
                        <span>Start Webcam</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Charts / Summary -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <div class="glass p-6 rounded-3xl bg-slate-900/50">
                <h4 class="text-slate-500 text-[10px] uppercase font-bold mb-4">Total Objects</h4>
                <p id="total-count" class="text-4xl font-black text-white">0</p>
            </div>
            <!-- Breakdown Container -->
            <div id="breakdown-container"
                class="md:col-span-3 glass p-6 rounded-3xl h-full flex items-center gap-6 overflow-x-auto">
                <div class="text-slate-600 text-sm italic">Count breakdown will appear here...</div>
            </div>
        </div>
    </div>

    <!-- Right Sidebar (Controls & Logs) -->
    <div class="space-y-8">
        <div class="glass p-6 rounded-3xl">
            <h4 class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-6">Playback Controls</h4>
            <div class="flex gap-4 justify-center mb-8">
                <button class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition-colors">⏮</button>
                <button class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition-colors">⏸</button>
                <button class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition-colors">⏯</button>
                <button class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl transition-colors">⏭</button>
            </div>
            <label class="text-xs text-slate-500 mb-2 block">Detection Threshold (Confidence)</label>
            <input type="range" min="1" max="100" value="50"
                class="w-full accent-cyan-500 bg-slate-800 rounded-lg appearance-none h-1 cursor-pointer">
            <div class="flex justify-between text-[10px] text-slate-600 mt-2">
                <span>0.1</span>
                <span>0.5</span>
                <span>1.0</span>
            </div>
        </div>

        <div class="glass p-6 rounded-3xl">
            <h4 class="text-slate-400 text-xs uppercase tracking-widest font-bold mb-6">Detection Logs</h4>
            <div id="log-container"
                class="space-y-3 font-mono text-[10px] text-slate-400 overflow-y-auto max-h-48 custom-scrollbar">
                <p>[SYSTEM] Ready for counting.</p>
            </div>
            <button id="download-csv"
                class="w-full mt-6 bg-cyan-500 hover:bg-cyan-600 py-3 rounded-2xl font-bold text-slate-900 text-sm shadow-lg transition-all">
                Export CSV Report
            </button>
        </div>
    </div>
</div>

<script src="/static/js/counter.js"></script>
{% endblock %}
